version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: widen
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 90
      semver-minor-days: 21
      semver-patch-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
